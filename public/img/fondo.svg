<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="blobNaranja" cx="26%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#FF8C4A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF8C4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobRojizo" cx="88%" cy="82%" r="58%">
      <stop offset="0%" stop-color="#D8491F" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D8491F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobDurazno" cx="82%" cy="8%" r="46%">
      <stop offset="0%" stop-color="#FFC98B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC98B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCrema" cx="8%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#FFE7CF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFE7CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#FFF3E7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF3E7" stop-opacity="0"/>
    </radialGradient>

    <filter id="desenfoque" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="desenfoqueSuave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.4
                0 0 0 0 0.2
                0 0 0 0.035 0"/>
    </filter>

    <pattern id="puntos" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#D8491F" opacity="0.10"/>
    </pattern>

    <!-- Iconos de línea tipo "comida", estilo geométrico coherente con el logo -->
    <g id="icoPizza" fill="none" stroke="#D8491F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 6 L58 54 Q32 66 6 54 Z"/>
      <path d="M14 50 Q32 40 50 50" stroke-dasharray="1 7"/>
      <circle cx="27" cy="30" r="2.6" fill="#D8491F" stroke="none"/>
      <circle cx="37" cy="38" r="2.6" fill="#D8491F" stroke="none"/>
      <circle cx="30" cy="44" r="2.6" fill="#D8491F" stroke="none"/>
    </g>

    <g id="icoBurger" fill="none" stroke="#D8491F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 26 Q32 8 56 26"/>
      <circle cx="20" cy="18" r="1.4" fill="#D8491F" stroke="none"/>
      <circle cx="32" cy="14" r="1.4" fill="#D8491F" stroke="none"/>
      <circle cx="44" cy="18" r="1.4" fill="#D8491F" stroke="none"/>
      <line x1="8" y1="32" x2="56" y2="32"/>
      <path d="M6 40 Q32 48 58 40"/>
      <path d="M9 48 Q32 58 55 48 Q32 66 9 48 Z"/>
    </g>

    <g id="icoBebida" fill="none" stroke="#D8491F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 12 H48 L43 56 Q32 60 21 56 Z"/>
      <line x1="19.5" y1="22" x2="44.5" y2="22"/>
      <path d="M38 6 L46 12" />
      <line x1="38" y1="2" x2="38" y2="8"/>
    </g>

    <g id="icoBowl" fill="none" stroke="#D8491F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 30 Q6 54 32 54 Q58 54 58 30 Z"/>
      <path d="M2 30 H62"/>
      <path d="M18 30 Q22 16 18 6" stroke-dasharray="1 6"/>
      <path d="M32 30 Q36 14 30 4" stroke-dasharray="1 6"/>
      <path d="M46 30 Q50 18 45 8" stroke-dasharray="1 6"/>
    </g>

    <g id="icoChile" fill="none" stroke="#D8491F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8 Q14 14 18 20"/>
      <path d="M18 18 Q46 10 52 34 Q56 52 38 58 Q18 60 12 42 Q8 28 18 18 Z"/>
    </g>

    <g id="icoHierba" fill="none" stroke="#D8491F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 60 V14"/>
      <path d="M32 44 Q14 40 12 22 Q28 24 32 40"/>
      <path d="M32 34 Q50 30 52 12 Q36 14 32 30"/>
      <path d="M32 54 Q18 52 16 38 Q28 40 32 50"/>
    </g>

    <g id="icoCubiertos" fill="none" stroke="#D8491F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 6 V26 Q14 32 20 32 Q26 32 26 26 V6"/>
      <line x1="20" y1="6" x2="20" y2="32"/>
      <line x1="20" y1="32" x2="20" y2="60"/>
      <path d="M44 6 C54 8 54 22 44 26 V60"/>
    </g>
  </defs>

  <!-- Base -->
  <rect width="1600" height="1000" fill="#FFF9F4"/>

  <!-- Textura de puntos sutil -->
  <rect width="1600" height="1000" fill="url(#puntos)"/>

  <!-- Manchas difuminadas tipo "salsa" -->
  <g filter="url(#desenfoque)">
    <rect width="1600" height="1000" fill="url(#blobNaranja)"/>
    <rect width="1600" height="1000" fill="url(#blobRojizo)"/>
    <rect width="1600" height="1000" fill="url(#blobDurazno)"/>
    <rect width="1600" height="1000" fill="url(#blobCrema)"/>
  </g>

  <!-- Halo detrás del contenido central, tipo "foco de estudio de fotografía de comida" -->
  <rect width="1600" height="1000" fill="url(#halo)" filter="url(#desenfoqueSuave)"/>

  <!-- Anillo de plato muy sutil detrás del hero -->
  <circle cx="800" cy="430" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="800" cy="430" r="360" fill="none" stroke="#FFC98B" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Iconos de comida dispersos, estilo "doodle" de menú -->
  <g opacity="0.85">
    <use href="#icoPizza"    x="120"  y="90"  width="70" height="70" opacity="0.16" transform="rotate(-12 155 125)"/>
    <use href="#icoBurger"   x="1370" y="120" width="80" height="80" opacity="0.15" transform="rotate(8 1410 160)"/>
    <use href="#icoBebida"   x="60"   y="640" width="64" height="64" opacity="0.15" transform="rotate(-6 92 672)"/>
    <use href="#icoBowl"     x="1400" y="660" width="86" height="86" opacity="0.15" transform="rotate(10 1443 703)"/>
    <use href="#icoChile"    x="230"  y="830" width="56" height="56" opacity="0.14" transform="rotate(18 258 858)"/>
    <use href="#icoHierba"   x="1300" y="850" width="60" height="60" opacity="0.16" transform="rotate(-10 1330 880)"/>
    <use href="#icoCubiertos" x="1470" y="380" width="58" height="58" opacity="0.13" transform="rotate(14 1499 409)"/>
    <use href="#icoPizza"    x="1250" y="40"  width="46" height="46" opacity="0.12" transform="rotate(24 1273 63)"/>
    <use href="#icoBebida"   x="1500" y="880" width="50" height="50" opacity="0.12" transform="rotate(6 1525 905)"/>
    <use href="#icoBurger"   x="40"   y="330" width="52" height="52" opacity="0.12" transform="rotate(-16 66 356)"/>
    <use href="#icoHierba"   x="120"  y="500" width="42" height="42" opacity="0.13" transform="rotate(20 141 521)"/>
    <use href="#icoChile"    x="1440" y="540" width="46" height="46" opacity="0.12" transform="rotate(-20 1463 563)"/>
  </g>

  <!-- Franja inferior tipo "mesa": borde de plato festoneado -->
  <g transform="translate(0 918)">
    <rect width="1600" height="82" fill="#FFEDE1" opacity="0.55"/>
    <g fill="#FFF9F4">
      <circle cx="0"    cy="0" r="30"/>
      <circle cx="60"   cy="0" r="30"/>
      <circle cx="120"  cy="0" r="30"/>
      <circle cx="180"  cy="0" r="30"/>
      <circle cx="240"  cy="0" r="30"/>
      <circle cx="300"  cy="0" r="30"/>
      <circle cx="360"  cy="0" r="30"/>
      <circle cx="420"  cy="0" r="30"/>
      <circle cx="480"  cy="0" r="30"/>
      <circle cx="540"  cy="0" r="30"/>
      <circle cx="600"  cy="0" r="30"/>
      <circle cx="660"  cy="0" r="30"/>
      <circle cx="720"  cy="0" r="30"/>
      <circle cx="780"  cy="0" r="30"/>
      <circle cx="840"  cy="0" r="30"/>
      <circle cx="900"  cy="0" r="30"/>
      <circle cx="960"  cy="0" r="30"/>
      <circle cx="1020" cy="0" r="30"/>
      <circle cx="1080" cy="0" r="30"/>
      <circle cx="1140" cy="0" r="30"/>
      <circle cx="1200" cy="0" r="30"/>
      <circle cx="1260" cy="0" r="30"/>
      <circle cx="1320" cy="0" r="30"/>
      <circle cx="1380" cy="0" r="30"/>
      <circle cx="1440" cy="0" r="30"/>
      <circle cx="1500" cy="0" r="30"/>
      <circle cx="1560" cy="0" r="30"/>
      <circle cx="1620" cy="0" r="30"/>
    </g>
  </g>
</svg>
